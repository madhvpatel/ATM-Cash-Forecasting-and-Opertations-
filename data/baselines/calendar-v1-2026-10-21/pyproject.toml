[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atm-cash-forecast-poc"
version = "0.1.0"
description = "Two-terminal cash demand forecasting and replenishment POC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "lightgbm>=4.3,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1.2,<2", "wheel>=0.42,<1"]
experiments = [
  "ipykernel>=6,<7",
  "nbconvert>=7,<8",
  "nbformat>=5,<6",
  "statsmodels>=0.14,<1",
]

[project.scripts]
atm-forecast = "atm_cash_forecast.cli:main"
atm-dashboard = "atm_cash_forecast.dashboard:main"
atm-demand-benchmark = "atm_cash_forecast.demand_evaluation:main"
atm-demand-train = "atm_cash_forecast.demand_artifact:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
