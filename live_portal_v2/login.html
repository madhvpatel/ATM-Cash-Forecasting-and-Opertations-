<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Cash Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F8FAFC;
      --bg-surface: #FFFFFF;
      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --brand: #4F46E5;
      --brand-hover: #4338CA;
      --danger-bg: #FEF2F2;
      --danger-text: #B91C1C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 8px;
      display: grid; place-items: center;
      background: var(--text-main); color: #fff;
      font-weight: 700; font-size: 13px; letter-spacing: 0.04em;
    }
    .brand-title { font-weight: 700; font-size: 13px; letter-spacing: 0.08em; }
    .brand-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    h1 { font-size: 18px; margin: 0 0 20px; font-weight: 600; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      color: var(--text-main);
    }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: var(--brand-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger-text);
      font-size: 13px;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-mark">CI</div>
      <div>
        <div class="brand-title">CASH INTELLIGENCE</div>
        <div class="brand-sub">Central Treasury Operations</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <div class="error" id="error" role="alert" aria-live="polite"></div>
    <form id="loginForm">
      <label for="name">User name</label>
      <input id="name" name="name" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submit">Sign in</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      submit.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: form.elements.name.value.trim(), password: form.elements.password.value })
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        errorBox.textContent = data.error || 'Sign-in failed. Please try again.';
        errorBox.classList.add('show');
        form.elements.password.value = '';
        form.elements.password.focus();
      } catch (err) {
        errorBox.textContent = 'Cannot reach the portal server. Is it running?';
        errorBox.classList.add('show');
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
